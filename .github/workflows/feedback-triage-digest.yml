name: Feedback Triage Digest

on:
  # フィードバック未対応の日次ダイジェスト（機能別残数）を Teams へ通知。
  # サーバ側で集計〜投稿まで完結する endpoint を curl するだけ。未対応0件なら投稿しない。
  # JST 平日 5:31（UTC-9 = UTC 20:31 の日〜木）。社長が朝6時台に確認するため（2026-10-24 社長指示）。
  schedule:
    - cron: "31 20 * * 0-4"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - name: Call feedback triage digest endpoint
        run: |
          HTTP_STATUS=$(curl -s -o /tmp/body -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://portal.esco-duct.com/api/feedback/triage/digest")
          echo "HTTP status: $HTTP_STATUS"
          cat /tmp/body || true; echo ""
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "digest endpoint returned non-200: $HTTP_STATUS"; exit 1
          fi
          echo "feedback triage digest completed."

      - name: Notify Teams on failure
        if: failure()
        uses: daigo-cloud/devlop-cron/.github/actions/notify-failure@main
        with:
          webhook-url: ${{ secrets.MONITORING_TEAMS_WEBHOOK_URL }}

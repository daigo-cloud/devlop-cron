name: Urgent Escalation Remind

on:
  # 緊急エスカレーション: 「新規」のまま未確認の報告（緊急=60分経過／重要=翌営業日08:00 JST）を
  # 経営役へ Teams DM で再通知する。
  # devlopのlib/monitoring/cron.ts CRON_JOBSに"urgent-escalation/remind"として
  # 1時間ごとの想定で登録済み。
  # Vercel Hobby の cron 枠は使えないため GitHub Actions schedule で駆動する（AGENTS.md）。
  # 毎時07分（UTC）。冪等: エンドポイント側(GET /api/urgent-escalation/cron/remind)が
  # reminderSentAt で重複送信を防ぐためstepの再実行は安全。
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

# 同一ワークフローの連続起動では古い実行をキャンセルし多重実行を防ぐ。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Call urgent-escalation remind endpoint
        run: |
          HTTP_STATUS=$(curl -s -o /tmp/urgent_escalation_body -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://portal.esco-duct.com/api/urgent-escalation/cron/remind")
          echo "HTTP status: $HTTP_STATUS"
          echo "Response:"
          cat /tmp/urgent_escalation_body || true
          echo ""
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "urgent-escalation remind endpoint returned non-200 status: $HTTP_STATUS"
            exit 1
          fi
          echo "Urgent escalation remind check completed."

      - name: Notify Teams on failure
        if: failure()
        uses: daigo-cloud/devlop-cron/.github/actions/notify-failure@main
        with:
          webhook-url: ${{ secrets.MONITORING_TEAMS_WEBHOOK_URL }}

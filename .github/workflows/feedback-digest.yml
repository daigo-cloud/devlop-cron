name: feedback-digest
on:
  schedule:
    - cron: "37 20 * * 0-4"   # JST 平日(月〜金) 05:37（UTC前日20:37・日〜木）
  workflow_dispatch: {}
concurrency:
  group: feedback-digest
  cancel-in-progress: true
jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Call feedback digest endpoint
        run: |
          curl -sS -f -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://portal.esco-duct.com/api/feedback/digest"

      - name: Notify Teams on failure
        if: failure()
        uses: daigo-cloud/devlop-cron/.github/actions/notify-failure@main
        with:
          webhook-url: ${{ secrets.MONITORING_TEAMS_WEBHOOK_URL }}

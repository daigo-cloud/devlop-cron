# EscoSales（devlop）保存レポートの定期メール配信（SFの「レポートの購読」相当・devlop PR #925）。
# 本体側エンドポイント: GET /api/crm/cron/report-subscriptions（CRON_SECRET Bearer・fail-closed）。
# 実行対象の抽出（JST時刻/頻度/二重送信ガード）は本体側 route が行うため、ここは毎時叩くだけ。
# 公開リポ devlop-cron で実行（private Actions 課金を避ける）。
name: CRM Report Subscriptions

on:
  schedule:
    # 毎時（分を11にずらしてGitHub Actionsの毎時00分混雑による遅延を緩和。
    # 配信時刻の判定はエンドポイント側がJSTの「時」で行うため分のずれは無害）。
    - cron: "11 * * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger CRM report subscription delivery
        run: |
          set -u
          URL="https://portal.esco-duct.com/api/crm/cron/report-subscriptions"
          echo "== GET ${URL}"
          code=$(curl -sS -o /tmp/out.json -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" "${URL}")
          echo "HTTP ${code}"
          head -c 1200 /tmp/out.json 2>/dev/null || true
          echo ""
          [ "${code}" = "200" ] || { echo "!! crm/report-subscriptions cron failed (HTTP ${code})"; exit 1; }
          echo "CRM report subscription delivery completed."
